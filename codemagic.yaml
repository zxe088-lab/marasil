# Owner-approved internal TestFlight build from the GitHub keyboard fix branch.
workflows:
  ios-release:
    name: BPB OLD - keyboard TestFlight internal
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: BPM old API
    environment:
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: com.zxe088.bpmold
        APP_STORE_APPLE_ID: "6821347207"
        APP_NAME: BPM old
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      node: 20
      xcode: 26.6
      cocoapods: default
    scripts:
      - name: Prepare web files
        script: |
          [ "$CM_BRANCH" = "feat/blackberry-stickers" ] || { echo "TestFlight workflow requires fix branch"; exit 1; }
          node --test tests/viewport.test.cjs
          rm -rf www && mkdir -p www
          cp index.html app.js style.css firebase-config.js manifest.json icon-192.png icon-512.png www/
          cp blackberry-48.png www/
          for f in privacy.html terms.html; do [ -f "$f" ] && cp "$f" www/; done
          # sounds/bbm.mp3 is for the website only, not bundled in the App Store build
          grep -q 'data-section="pending"' www/index.html
          node --check www/app.js

      - name: Install packages
        script: npm install

      - name: Bundle Firebase locally
        script: |
          npm run bundle-firebase
          python3 - <<'PY'
          import re
          p = 'www/index.html'
          s = open(p, encoding='utf-8').read()
          s = re.sub(r'\s*<script src="https://www\.gstatic\.com/firebasejs/[^"]+"></script>', '', s)
          s = s.replace('<script src="firebase-config.js"></script>',
                        '<script src="firebase-bundle.js"></script>\n<script src="firebase-config.js"></script>')
          open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -q firebase-bundle.js www/index.html

      - name: Create iOS project
        script: |
          npx cap add ios
          mkdir -p assets
          cp icon-1024.png assets/icon-only.png
          cp icon-1024.png assets/icon-foreground.png
          cp icon-1024.png assets/icon-background.png
          npx capacitor-assets generate --ios
          npx cap sync ios

      - name: App settings
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.1.0" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $APP_NAME" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string $APP_NAME" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string نحتاج المايك لتسجيل رسالة صوتية تختار إرسالها" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string نحتاج الكاميرا لالتقاط صورة تُعرض مرة واحدة" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string اختر صورة لإرسالها لمرة واحدة" "$PLIST" || true

      - name: Restrict app to iPhone
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("ios/App/App.xcodeproj/project.pbxproj")
          s = p.read_text()
          s, count = re.subn(r'TARGETED_DEVICE_FAMILY\s*=\s*[^;]+;', 'TARGETED_DEVICE_FAMILY = 1;', s)
          if count == 0:
              raise SystemExit("No TARGETED_DEVICE_FAMILY settings found")
          p.write_text(s)
          print(f"Configured {count} build settings for iPhone only")
          PY

      - name: Code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'

      - name: Build number
        script: |
          cd ios/App
          LATEST_TESTFLIGHT_BUILD=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" --pre-release-version "1.1.0")
          case "$LATEST_TESTFLIGHT_BUILD" in ""|*[!0-9]*) echo "Invalid TestFlight build number"; exit 1 ;; esac
          NEXT_TEST_BUILD=$((LATEST_TESTFLIGHT_BUILD + 1))
          if [ "$NEXT_TEST_BUILD" -le "$BUILD_NUMBER" ]; then NEXT_TEST_BUILD=$((BUILD_NUMBER + 1)); fi
          agvtool new-version -all "$NEXT_TEST_BUILD"

      - name: Build ipa
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false # Upload for internal testing, no external beta review.
        submit_to_app_store: false
        cancel_previous_submissions: false
        expire_build_submitted_for_review: false
