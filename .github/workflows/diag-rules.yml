name: diag-rules
on:
  push:
    branches: [diag-rules]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live group rules
        run: |
          KEY=AIzaSyDn_609hmjmbSD8hFcWc8-PcEDhI61D4z8; P=bbm-old-1e477
          B="https://firestore.googleapis.com/v1/projects/$P/databases/(default)/documents"
          su(){ curl -s -H 'Content-Type: application/json' -d '{"returnSecureToken":true}' "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=$KEY"; }
          RA=$(su); TA=$(echo "$RA"|jq -r .idToken); A=$(echo "$RA"|jq -r .localId)
          RB=$(su); TB=$(echo "$RB"|jq -r .idToken); Bu=$(echo "$RB"|jq -r .localId)
          RC=$(su); TC=$(echo "$RC"|jq -r .idToken); C=$(echo "$RC"|jq -r .localId)
          G=probe$(date +%s); NOW=$(date +%s000)
          arr(){ local o=""; for x in "$@"; do o="$o{\"stringValue\":\"$x\"},"; done; echo "{\"arrayValue\":{\"values\":[${o%,}]}}"; }
          req(){ c=$(curl -s -o r.json -w '%{http_code}' -X "$2" -H "Authorization: Bearer $1" -H 'Content-Type: application/json' "$B/$3" ${4:+-d "$4"}); echo "::notice::$5 -> $c $(jq -c '.error.message // empty' r.json 2>/dev/null | cut -c1-80)"; }
          req "$TA" PATCH "chats/$G?currentDocument.exists=false" "{\"fields\":{\"isGroup\":{\"booleanValue\":true},\"name\":{\"stringValue\":\"probe\"},\"owner\":{\"stringValue\":\"$A\"},\"admins\":{\"arrayValue\":{}},\"members\":$(arr $A),\"invites\":{\"mapValue\":{\"fields\":{\"$Bu\":{\"integerValue\":\"$NOW\"}}}},\"lastTs\":{\"integerValue\":\"$NOW\"}}}" "1 create with invite (expect 200)"
          req "$TB" PATCH "chats/$G?currentDocument.exists=true&updateMask.fieldPaths=members&updateMask.fieldPaths=invites" "{\"fields\":{\"members\":$(arr $A $Bu),\"invites\":{\"mapValue\":{}}}}" "2 invitee accepts (expect 200)"
          req "$TC" PATCH "chats/$G?currentDocument.exists=true&updateMask.fieldPaths=members" "{\"fields\":{\"members\":$(arr $A $Bu $C)}}" "3 stranger joins (expect 403)"
          req "$TA" PATCH "chats/$G?currentDocument.exists=true&updateMask.fieldPaths=admins" "{\"fields\":{\"admins\":$(arr $Bu)}}" "4 owner sets admin (expect 200)"
          req "$TB" PATCH "chats/$G?currentDocument.exists=true&updateMask.fieldPaths=members&updateMask.fieldPaths=name" "{\"fields\":{\"members\":$(arr $A $Bu $C),\"name\":{\"stringValue\":\"x\"}}}" "5 admin adds member + rename (expect 200)"
          req "$TB" PATCH "chats/$G?currentDocument.exists=true&updateMask.fieldPaths=owner" "{\"fields\":{\"owner\":{\"stringValue\":\"$Bu\"}}}" "6 admin takes ownership (expect 403)"
          req "$TA" PATCH "chats/$G?currentDocument.exists=true&updateMask.fieldPaths=owner" "{\"fields\":{\"owner\":{\"stringValue\":\"$Bu\"}}}" "7 owner transfers (expect 200)"
          req "$TB" DELETE "chats/$G" "" "8 new owner deletes (expect 200)"
          for T in "$TA" "$TB" "$TC"; do curl -s -o /dev/null -H 'Content-Type: application/json' -d "{\"idToken\":\"$T\"}" "https://identitytoolkit.googleapis.com/v1/accounts:delete?key=$KEY"; done
