name: diag-rules
on:
  push:
    branches: [diag-rules]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test API key from app origins
        run: |
          KEY=AIzaSyDn_609hmjmbSD8hFcWc8-PcEDhI61D4z8
          for ref in "" "capacitor://localhost" "capacitor://localhost/" "https://zxe088-lab.github.io/"; do
            if [ -n "$ref" ]; then H=(-H "Referer: $ref" -H "Origin: ${ref%/}"); else H=(); fi
            R=$(curl -s "${H[@]}" -H 'Content-Type: application/json' -d '{"returnSecureToken":true}' "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=$KEY")
            T=$(echo "$R" | jq -r .idToken)
            if [ "$T" != null ]; then curl -s -o /dev/null -H 'Content-Type: application/json' -d "{\"idToken\":\"$T\"}" "https://identitytoolkit.googleapis.com/v1/accounts:delete?key=$KEY"; echo "::notice::referer [$ref] -> ok"; else echo "::notice::referer [$ref] -> $(echo "$R" | jq -c '.error.message')"; fi
          done
