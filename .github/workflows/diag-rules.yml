name: diag-rules
on:
  push:
    branches: [diag-rules]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe VPS services
        run: |
          for u in https://51-254-218-100.sslip.io/api/stories https://51-254-218-100.sslip.io/ https://51-254-218-100.sslip.io/api/notify; do
            r=$(curl -s -m 20 -o b.txt -w '%{http_code} %{time_total}s' "$u" 2>&1); echo "::notice::$u -> $r $(head -c 120 b.txt | tr '\n' ' ')"
          done
          r=$(curl -s -m 20 -o /dev/null -w '%{http_code}' -X OPTIONS -H 'Origin: capacitor://localhost' -H 'Access-Control-Request-Method: GET' https://51-254-218-100.sslip.io/api/stories); echo "::notice::CORS preflight -> $r"
          nc -z -w 8 51.254.218.100 443 && echo "::notice::port 443 open" || echo "::notice::port 443 closed"
