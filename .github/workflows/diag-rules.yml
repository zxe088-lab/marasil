name: diag-rules
on:
  push:
    branches: [diag-rules]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live group rules
        run: |
          KEY=AIzaSyDn_609hmjmbSD8hFcWc8-PcEDhI61D4z8; P=bbm-old-1e477
          B="https://firestore.googleapis.com/v1/projects/$P/databases/(default)/documents"
          su(){ curl -s -H 'Content-Type: application/json' -d '{"returnSecureToken":true}' "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=$KEY"; }
          RA=$(su); TA=$(echo "$RA"|jq -r .idToken); A=$(echo "$RA"|jq -r .localId)
          RB=$(su); TB=$(echo "$RB"|jq -r .idToken); Bu=$(echo "$RB"|jq -r .localId)
          RC=$(su); TC=$(echo "$RC"|jq -r .idToken); C=$(echo "$RC"|jq -r .localId)
          G=probe$(date +%s); NOW=$(date +%s000)
          arr(){ local o=""; for x in "$@"; do o="$o{\"stringValue\":\"$x\"},"; done; echo "{\"arrayValue\":{\"values\":[${o%,}]}}"; }
          req(){ # token method path body label
            c=$(curl -s -o r.json -w '%{http_code}' -X "$2" -H "Authorization: Bearer $1" -H 'Content-Type: application/json' "$B/$3" ${4:+-d "$4"}); echo "::notice::$5 -> $c $(jq -c '.error.message // empty' r.json 2>/dev/null | cut -c1-120)"; }
          req "$TA" PATCH "chats/$G?currentDocument.exists=false" "{\"fields\":{\"isGroup\":{\"booleanValue\":true},\"name\":{\"stringValue\":\"probe\"},\"owner\":{\"stringValue\":\"$A\"},\"members\":$(arr $A $Bu),\"createdAt\":{\"integerValue\":\"$NOW\"},\"lastTs\":{\"integerValue\":\"$NOW\"},\"lastMsg\":{\"stringValue\":\"x\"},\"lastFrom\":{\"stringValue\":\"$A\"},\"lastKind\":{\"stringValue\":\"system\"}}}" "1 owner creates group"
          IMG=$(head -c 450000 /dev/urandom | base64 -w0)
          printf '{"fields":{"from":{"stringValue":"%s"},"ts":{"integerValue":"%s"},"kind":{"stringValue":"photo"},"image":{"stringValue":"data:image/jpeg;base64,%s"},"expiresAt":{"timestampValue":"2026-12-01T00:00:00Z"}}}' "$Bu" "$NOW" "$IMG" > big.json
          c=$(curl -s -o r.json -w '%{http_code}' -X POST -H "Authorization: Bearer $TB" -H 'Content-Type: application/json' "$B/chats/$G/messages" --data-binary @big.json); echo "::notice::2 member posts 600KB photo message -> $c $(jq -c '.error.message // empty' r.json|cut -c1-100)"
          req "$TB" POST "chats/$G/messages" "{\"fields\":{\"from\":{\"stringValue\":\"$Bu\"},\"ts\":{\"integerValue\":\"$NOW\"},\"kind\":{\"stringValue\":\"group-invite\"},\"gid\":{\"stringValue\":\"x\"}}}" "3 member posts custom kind"
          req "$TA" DELETE "chats/$G" "" "4 owner deletes group (cleanup)"
          for T in "$TA" "$TB" "$TC"; do curl -s -o /dev/null -H 'Content-Type: application/json' -d "{\"idToken\":\"$T\"}" "https://identitytoolkit.googleapis.com/v1/accounts:delete?key=$KEY"; done
          echo "::notice::done"
