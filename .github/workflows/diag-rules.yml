name: diag-rules
on:
  push:
    branches: [diag-rules]
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Test group rules in emulator
        working-directory: rules-test
        run: |
          npm install --no-audit --no-fund >/dev/null 2>&1
          npx firebase emulators:exec --only firestore --project demo-bpb "node test.mjs" > out.txt 2>&1 || true
          grep -E "PASS|FAIL|RESULT|rror" out.txt | head -60
          grep -E "FAIL|RESULT|Error compiling|rror:" out.txt | head -9 | while read l; do echo "::notice::$l"; done
