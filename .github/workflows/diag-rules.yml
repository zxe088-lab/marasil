name: diag-rules
on:
  push:
    branches: [diag-rules]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe stories API with a temp account
        run: |
          KEY=AIzaSyDn_609hmjmbSD8hFcWc8-PcEDhI61D4z8
          R=$(curl -s -H 'Content-Type: application/json' -d '{"returnSecureToken":true}' "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=$KEY"); T=$(echo "$R"|jq -r .idToken)
          r=$(curl -s -m 40 -o b.txt -w '%{http_code} %{time_total}s' -H "Authorization: Bearer $T" -H 'Origin: capacitor://localhost' https://51-254-218-100.sslip.io/api/stories); echo "::notice::GET stories -> $r $(head -c 300 b.txt | tr '\n' ' ')"
          r=$(curl -s -m 40 -o b.txt -w '%{http_code}' -H "Authorization: Bearer $T" "https://firestore.googleapis.com/v1/projects/bbm-old-1e477/databases/(default)/documents/users/x"); echo "::notice::Firestore read -> $r $(head -c 200 b.txt | tr '\n' ' ')"
          curl -s -o /dev/null -H 'Content-Type: application/json' -d "{\"idToken\":\"$T\"}" "https://identitytoolkit.googleapis.com/v1/accounts:delete?key=$KEY"
