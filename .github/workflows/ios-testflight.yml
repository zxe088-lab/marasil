# بناء تطبيق BPB OLD للآيفون على GitHub Actions ورفعه لـ TestFlight
# بديل لـ codemagic.yaml — نفس الخطوات ونفس أدوات التوقيع (codemagic-cli-tools)
name: BPB OLD - iOS (GitHub Actions)

on:
  workflow_dispatch:        # تشغيل يدوي فقط من تبويب Actions
    inputs:
      version:
        description: "App version (CFBundleShortVersionString)"
        required: false
        default: "1.4.0"

jobs:
  ios-release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.zxe088.bpmold
      APP_NAME: BPB OLD
      XCODE_WORKSPACE: ios/App/App.xcworkspace
      XCODE_SCHEME: App
      # مفاتيح App Store Connect والشهادة — تُضاف في Settings > Secrets and variables > Actions
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install Codemagic CLI tools
        run: pip3 install --break-system-packages codemagic-cli-tools || pip3 install codemagic-cli-tools

      - name: Prepare web files
        run: |
          [ "$GITHUB_REF_NAME" = "fix/ios-keyboard-viewport" ] || { echo "Internal test build requires fix branch"; exit 1; }
          node --test tests/viewport.test.cjs
          rm -rf www && mkdir -p www
          cp index.html app.js style.css firebase-config.js manifest.json icon-192.png icon-512.png www/
          cp blackberry-48.png www/
          for f in privacy.html terms.html; do [ -f "$f" ] && cp "$f" www/; done
          cp -R fonts www/fonts
          cp -R sounds www/
          python3 -c "import json;assert len(json.load(open('sounds/tones/tones.json')))>0"
          grep -q 'data-section="pending"' www/index.html
          node --check www/app.js

      - name: Install packages
        run: npm install

      - name: Bundle Firebase locally
        run: |
          npm run bundle-firebase
          python3 - <<'PY'
          import re
          p = 'www/index.html'
          s = open(p, encoding='utf-8').read()
          s = re.sub(r'\s*<script src="https://www\.gstatic\.com/firebasejs/[^"]+"></script>', '', s)
          s = s.replace('<script src="firebase-config.js"></script>',
                        '<script src="firebase-bundle.js"></script>\n<script src="firebase-config.js"></script>')
          open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -q firebase-bundle.js www/index.html

      - name: Create iOS project
        run: |
          npx cap add ios
          mkdir -p assets
          # App Store icons must not have an alpha channel
          node -e "require('sharp')('icon-1024.png').flatten({background:'#000000'}).removeAlpha().png().toFile('assets/icon-only.png')"
          cp assets/icon-only.png assets/icon-foreground.png
          cp assets/icon-only.png assets/icon-background.png
          npx capacitor-assets generate --ios
          npx cap sync ios

      - name: App settings
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ inputs.version || '1.4.0' }}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $APP_NAME" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string $APP_NAME" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string نحتاج المايك لتسجيل رسالة صوتية تختار إرسالها" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string نحتاج الكاميرا لالتقاط صورة تُعرض مرة واحدة" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string اختر صورة لإرسالها لمرة واحدة" "$PLIST" || true

      - name: Push notifications
        run: |
          # نغمة التنبيه لازم تكون داخل التطبيق بصيغة caf
          # كل نغمة في sounds/tones تتحول لملف caf باسم الـ id (هذا اللي يشغّله الآيفون في الإشعار)
          python3 - <<'PY'
          import json, subprocess
          for t in json.load(open("sounds/tones/tones.json")):
              subprocess.run(["afconvert", "sounds/tones/" + t["file"], "ios/App/App/" + t["id"] + ".caf", "-d", "ima4", "-f", "caff"], check=True)
              print("tone", t["id"])
          PY
          cat > ios/App/App/App.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>aps-environment</key>
            <string>production</string>
            <key>com.apple.developer.applesignin</key>
            <array><string>Default</string></array>
          </dict>
          </plist>
          EOF
          # Capacitor يحتاج هذي الدوال عشان يوصل رمز الإشعارات (APNs token) للتطبيق
          python3 - <<'PY'
          from pathlib import Path
          p = Path("ios/App/App/AppDelegate.swift")
          s = p.read_text()
          if "capacitorDidRegisterForRemoteNotifications" not in s:
              add = '''
              func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
                  NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)
              }

              func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {
                  NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)
              }
          '''
              i = s.rstrip().rfind("}")
              s = s[:i] + add + s[i:]
              p.write_text(s)
          print("AppDelegate push hooks:", "capacitorDidRegisterForRemoteNotifications" in p.read_text())
          PY
          grep -q capacitorDidRegisterForRemoteNotifications ios/App/App/AppDelegate.swift
          gem list -i xcodeproj >/dev/null || gem install xcodeproj
          ruby -e '
            require "xcodeproj"
            p = Xcodeproj::Project.open("ios/App/App.xcodeproj")
            t = p.targets.find { |x| x.name == "App" }
            g = p.main_group.find_subpath("App", false)
            Dir.glob("ios/App/App/*.caf").map { |f| File.basename(f) }.each { |f| t.resources_build_phase.add_file_reference(g.new_reference(f)) }
            g.new_reference("App.entitlements")
            t.build_configurations.each { |c| c.build_settings["CODE_SIGN_ENTITLEMENTS"] = "App/App.entitlements" }
            p.save
          '
          grep -q bbm.caf ios/App/App.xcodeproj/project.pbxproj
          grep -q App.entitlements ios/App/App.xcodeproj/project.pbxproj

      - name: Sign in with Google and Apple
        run: |
          cp GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
          REV=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" ios/App/App/GoogleService-Info.plist)
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $REV" "$PLIST"
          ruby -e '
            require "xcodeproj"
            p = Xcodeproj::Project.open("ios/App/App.xcodeproj")
            t = p.targets.find { |x| x.name == "App" }
            g = p.main_group.find_subpath("App", false)
            t.resources_build_phase.add_file_reference(g.new_reference("GoogleService-Info.plist"))
            p.save
          '
          # تسجيل الدخول بجوجل يحتاج مكتبة GoogleSignIn
          sed -i '' "s#pod 'CapacitorFirebaseAuthentication', :path => '\(.*\)'#pod 'CapacitorFirebaseAuthentication/Google', :path => '\1'#" ios/App/Podfile
          grep -n "CapacitorFirebaseAuthentication/Google" ios/App/Podfile
          cd ios/App && pod install

      - name: Restrict app to iPhone
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("ios/App/App.xcodeproj/project.pbxproj")
          s = p.read_text()
          s, count = re.subn(r'TARGETED_DEVICE_FAMILY\s*=\s*[^;]+;', 'TARGETED_DEVICE_FAMILY = 1;', s)
          if count == 0:
              raise SystemExit("No TARGETED_DEVICE_FAMILY settings found")
          p.write_text(s)
          print(f"Configured {count} build settings for iPhone only")
          PY

      - name: Code signing
        run: |
          keychain initialize
          # تفعيل خاصية الإشعارات على معرّف التطبيق (لو كانت مفعلة ما يصير شي)
          BID=$(app-store-connect bundle-ids list --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier --json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["id"])') \
            && app-store-connect bundle-ids enable-capabilities "$BID" --capability 'Push Notifications' 'Sign In with Apple' || true
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build number
        run: |
          # رقم بناء متزايد دائمًا بحسب التاريخ والوقت (UTC)
          cd ios/App
          agvtool new-version -all "$(date -u +%Y%m%d%H%M)"

      - name: Build ipa
        run: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"

      - name: Upload to Apple for TestFlight and App Store
        run: |
          app-store-connect publish --path build/ios/ipa/*.ipa

      - name: Save ipa and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            build/ios/ipa/*.ipa
            /tmp/xcodebuild_logs/*.log
          if-no-files-found: ignore

